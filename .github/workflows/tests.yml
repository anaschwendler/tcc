name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python and dependencies
        run: uv sync
      - name: Download NLTK sentence tokenizer data
        run: uv run python -c "import nltk; nltk.download('punkt_tab')"
      - name: Run tests
        # Tests that need the raw CSTNews corpus are skipped: it is not in the repository.
        run: uv run pytest -q
